name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build APK using official Kivy Buildozer Docker image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/home/user/hostcwd \
            -e USER=user \
            kivy/buildozer:latest \
            android debug

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: flappy-apk
          path: bin/*.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-latest
          name: "Flappy Game Android APK"
          body: "Direct download for the latest Flappy Game Android APK. Download on your phone and tap to install!"
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Deploy Flappy Game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygbag

      - name: Convert MP3 music to OGG for browser compatibility
        run: |
          sudo apt-get install -y ffmpeg
          for f in *.mp3; do
            base="${f%.mp3}"
            if [ ! -f "${base}.ogg" ]; then
              ffmpeg -i "$f" -c:a libvorbis -q:a 4 "${base}.ogg"
              echo "Converted $f -> ${base}.ogg"
            fi
          done

      - name: Build web game with pygbag
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pygbag --disable-sound-format-error --build .

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build/web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

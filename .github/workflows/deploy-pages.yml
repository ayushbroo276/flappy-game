name: Deploy Flappy Game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygbag

      - name: Convert MP3 music to OGG for browser compatibility
        run: |
          sudo apt-get install -y ffmpeg
          for f in *.mp3; do
            base="${f%.mp3}"
            if [ ! -f "${base}.ogg" ]; then
              ffmpeg -i "$f" -c:a libvorbis -q:a 4 "${base}.ogg"
              echo "Converted $f -> ${base}.ogg"
            fi
          done

      - name: Build web game with pygbag
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pygbag --disable-sound-format-error --build .

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modi-flappy"
version = "1.0.0"
description = "A portrait arcade game for Android, the web, and desktop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce",
    "pygbag",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"assets/images" = ["assets/images/*.jpg", "assets/images/*.jpeg", "assets/images/*.png"]
"assets/audio" = ["assets/audio/*.mp3", "assets/audio/*.ogg", "assets/audio/*.wav"]
